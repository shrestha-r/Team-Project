spring.datasource.url=${DEVREADY_DB_URL:jdbc:postgresql://localhost:5432/devready}
spring.datasource.username=${DEVREADY_DB_USER:postgres}
spring.datasource.password=${DEVREADY_DB_PASS:password}

spring.jpa.hibernate.ddl-auto=${DEVREADY_DDL_AUTO:update}
spring.jpa.show-sql=${DEVREADY_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

app.jwt.secret=${DEVREADY_JWT_SECRET:devready-change-this-secret-to-a-32-plus-char-key}
app.jwt.expiration-ms=${DEVREADY_JWT_EXPIRATION_MS:86400000}
